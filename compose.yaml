# Tripwire plus its logging stack.
# Works with `podman compose` and `docker compose`.
#
# Four services:
#   tripwire    the receiver and cover site
#   vector      tails the receiver's JSON lines and ships them
#   opensearch  the store, with the security plugin enabled
#   dashboards  the query and visualisation front end
#
# Every published port is bound to 127.0.0.1 on purpose. A TLS proxy or
# tunnel you control is what should face the network; none of these
# containers must ever be the thing listening on a public interface. The
# dashboard in particular is an administrative interface and belongs behind
# an SSH tunnel, not on the internet.
#
# Before the first run:
#
#   1. OpenSearch needs a raised mmap limit, which a rootless container
#      cannot set for itself:
#        sudo sysctl -w vm.max_map_count=262144
#        echo 'vm.max_map_count=262144' | sudo tee /etc/sysctl.d/99-opensearch.conf
#
#   2. Create the .env file holding the admin password. ./setup-logging.sh
#      generates one and never prints it.
#
# The OPENSEARCH_INITIAL_ADMIN_PASSWORD is read from .env, which is listed in
# .containerignore and must never be committed.

services:
  tripwire:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/tripwire:latest
    container_name: tripwire
    ports:
      - "127.0.0.1:8787:8787"
    # The only route in is the Cloudflare tunnel on this host, so the
    # CF-Connecting-IP it sets is the real client. Never set this if the
    # port is ever reachable another way.
    command: ["--host", "0.0.0.0", "--port", "8787", "--db", "/data/tripwire.sqlite3", "--trust-proxy"]
    environment:
      # Picked up by the receiver's --jsonl default. Writing the same events
      # to a file as well as SQLite means the shipper never touches the
      # database and cannot lock it.
      TRIPWIRE_JSONL: /var/log/tripwire/hits.jsonl
    volumes:
      - tripwire-data:/data:Z
      - tripwire-logs:/var/log/tripwire:Z
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    # The tarpit deliberately parks connections, and each one is a thread.
    # TARPIT_MAX_HOLDING caps that at 64 inside the application; this is the
    # backstop if that ever fails.
    pids_limit: 256
    restart: unless-stopped
    networks:
      - tripwire
    # Declared here rather than relying on the image. Podman builds in OCI
    # format by default, which discards the Containerfile HEALTHCHECK.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request as u, sys
          sys.exit(0 if u.urlopen('http://127.0.0.1:8787/healthz', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  vector:
    # 0.58.0 released 2026-08-26. Alpine rather than the Debian variant: the
    # recent vulnerability reports against these images have all tracked base
    # layer packages rather than Vector itself, so the thinner base is the
    # direct mitigation. About 61 MB against 97 MB.
    image: docker.io/timberio/vector:0.58.0-alpine
    container_name: tripwire-vector
    # The image's default config path is /etc/vector/vector.yaml. Without
    # this it never opens the TOML mounted below and restarts forever.
    command: ["--config", "/etc/vector/vector.toml"]
    depends_on:
      opensearch:
        condition: service_healthy
    # No password in the environment. Vector 0.57 disabled `${VAR}`
    # interpolation in config files, so an environment variable would be
    # shipped verbatim as the password and every write would return 401. The
    # secrets file below is the supported route, and it also keeps the
    # password out of `podman inspect`.
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro,Z
      # Written by ./setup-logging.sh with mode 600. Never commit it.
      - ./vector-secrets.json:/etc/vector/secrets.json:ro,Z
      - tripwire-logs:/var/log/tripwire:ro,Z
      # The disk buffer and the read checkpoints live here. Losing this
      # volume means re-reading files from the start, so keep it.
      - vector-data:/var/lib/vector:Z
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - tripwire

  # Reverse DNS, scanner range lists and optional reputation verdicts for
  # every address that appears in the indices. Same Python base as the
  # receiver, script bind-mounted, no image to build. It needs egress: DNS,
  # GitHub for the lists, and the two APIs when keys are configured.
  enricher:
    image: docker.io/library/python:3.14.7-alpine3.24
    container_name: tripwire-enricher
    command: ["python3", "/app/enrich.py"]
    # Container root, like Vector: the secrets file is mode 600 and owned by
    # the host user, which is who container root maps to under rootless
    # podman. Read-only filesystem and no capabilities take care of the rest.
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./enrich.py:/app/enrich.py:ro,Z
      - ./droppers.py:/app/droppers.py:ro,Z
      # Same file Vector reads: the admin password, plus the API keys when
      # ./setup-logging.sh found them in .env.
      - ./vector-secrets.json:/run/secrets/tripwire.json:ro,Z
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    networks:
      - tripwire

  opensearch:
    # 3.8.0 released 2026-08-04. Chosen over the 2.19.x maintenance line
    # because the Dashboards capabilities-route denial of service
    # CVE-2026-75897 covers 1.3.0 through 3.7.0, including all of 2.x, and
    # 3.8.0 is outside that range. Two open items to track: the bundled
    # Log4j 2.25.4 against CVE-2026-49844, and CVE-2026-83497, a
    # deserialisation flaw in the SQL plugin's cursor pagination. The SQL
    # plugin is not enabled here and the flaw needs an authenticated user.
    image: docker.io/opensearchproject/opensearch:3.8.0
    container_name: tripwire-opensearch
    environment:
      discovery.type: single-node
      # Off by default on single-node clusters, which turns the disk
      # watermarks bootstrap-opensearch.sh sets into no-ops.
      cluster.routing.allocation.disk.watermark.enable_for_single_data_node: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      # The security plugin stays on. It is what stops anything that reaches
      # port 9200 from reading the whole hit history unauthenticated.
      DISABLE_SECURITY_PLUGIN: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set this in .env}
      # Performance analyzer is an extra listener with no value here.
      DISABLE_INSTALL_DEMO_CONFIG: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data:Z
    ports:
      # Loopback by default. Set ADMIN_BIND in .env to the host's WireGuard
      # address so the sentinel's Vector can ship across the private link.
      # Never a public interface.
      - "${ADMIN_BIND:-127.0.0.1}:9200:9200"
    mem_limit: 2g
    restart: unless-stopped
    networks:
      - tripwire
    healthcheck:
      # -k because the demo configuration uses self-signed certificates.
      # Traffic stays inside the container network.
      test:
        - CMD-SHELL
        - >
          curl -sk -u "admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
          https://localhost:9200/_cluster/health
          | grep -qE '"status":"(green|yellow)"'
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 10

  dashboards:
    image: docker.io/opensearchproject/opensearch-dashboards:3.8.0
    container_name: tripwire-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_SSL_VERIFICATIONMODE: none
      # No anonymous read. Reaching the dashboard still costs a login.
      OPENSEARCH_SECURITY_ENABLE_MULTITENANCY: "false"
    ports:
      # Same bind as OpenSearch. Reach it with
      # `ssh -L 5601:${ADMIN_BIND}:5601 host`.
      - "${ADMIN_BIND:-127.0.0.1}:5601:5601"
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - tripwire

networks:
  tripwire:
    driver: bridge

volumes:
  tripwire-data:
  tripwire-logs:
  opensearch-data:
  vector-data:

  log_fields.message = '''{"ts":"2026-09-19T10:10:03+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.15","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":30,"hold_ms":0,"spoke":true,"http_requests":["connect x"]}'''


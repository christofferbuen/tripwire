# E1: an egress summary from package D. No ip at all; .source.ip must come
# out null rather than erroring, and the six egress_* fields move.
[[tests]]
name = "e1_egress_line"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:12:00+00:00","kind":"egress","egress_dst_ip":"198.51.100.20","egress_dst_port":4444,"egress_proto":"tcp","egress_uid":1000,"egress_scope":"container","egress_count":7}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(.classification == "egress-blocked")
    assert!(.egress.dst_port == 4444)
    assert!(.source.ip == null)
    '''

# E2: the sweep summary still classifies correctly now that the egress
# branch sits ahead of it in the chain.
[[tests]]
name = "e2_sweep_still_detected"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:13:00+00:00","kind":"sweep","ip":"203.0.113.20","distinct_ports":6,"ports":[22,25,80,443,3306,8080],"note":"touched 6 of 4 open ports within 30s"}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(.classification == "sweep-detected")
    '''

  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:09:00+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.11","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":30,"hold_ms":0,"spoke":true,"http_requests":["GET / HTTP/1.1"]}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]

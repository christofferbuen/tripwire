# Vector unit tests for vector-sentinel.toml's sentinel_events transform.
#
# Fixtures are synthetic, modelled on sentinel.py's JSONL output (the "emit"
# calls in Sentinel.handle and its protocol handlers), never production data.
# Addresses are from documentation ranges (RFC 5737 203.0.113.0/24).
#
# Run with ./test-vector.sh (sentinel or both). Vector cannot load
# vector-sentinel.toml and vector.toml together -- the two files each declare
# their own [sources.*] and [transforms.*] -- so this file only exercises
# sentinel_events; see vector-tests-collector.toml for hits.

# S1: baseline. A plain SSH connect line in today's format still classifies
# as a service interaction and names the tool from the SSH banner.
[[tests]]
name = "s1_baseline_ssh_connect"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:00:00+00:00","kind":"connect","port":22,"role":"ssh","ip":"203.0.113.5","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":120,"hold_ms":0,"spoke":true,"ssh_client":"SSH-2.0-Go","bytes_received":21,"persona":"ubuntu-web"}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(.classification == "service-interaction")
    assert!(.threat.tool == "go-ssh")
    '''

# S2: moves. Every flat name from the field-move table lands in its nested
# home with the same value, and none of the flat names survive. smtp.rcpt
# keeps both addresses.
[[tests]]
name = "s2_field_moves"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:05:00+00:00","kind":"connect","port":25,"role":"smtp","ip":"203.0.113.7","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":80,"hold_ms":0,"spoke":true,"tcp_rtt_ms":42.5,"tcp_rttvar_ms":5.25,"tcp_mss":1460,"smtp_helo":"mail.example.com","smtp_mail_from":"a@example.com","smtp_rcpt":["b@example.com","c@example.com"],"smtp_auth_user":"admin","smtp_auth_pass":"hunter2","smtp_starttls":true,"http_host_foreign":true,"bait_served":"aws-keys","bait_credential_used":true,"egress_dst_ip":"198.51.100.9","egress_dst_port":4444,"egress_proto":"tcp","egress_uid":1000,"egress_scope":"container","egress_count":3}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(.network.rtt_ms == 42.5)
    assert!(.network.rttvar_ms == 5.25)
    assert!(.network.mss == 1460)
    assert!(.smtp.helo == "mail.example.com")
    assert!(.smtp.mail_from == "a@example.com")
    assert!(array!(.smtp.rcpt) == ["b@example.com", "c@example.com"])
    assert!(length(array!(.smtp.rcpt)) == 2)
    assert!(.smtp.auth_user == "admin")
    assert!(.smtp.auth_pass == "hunter2")
    assert!(.smtp.starttls == true)
    assert!(.http.host_foreign == true)
    assert!(.bait.served == "aws-keys")
    assert!(.bait.credential_used == true)
    assert!(.egress.dst_ip == "198.51.100.9")
    assert!(.egress.dst_port == 4444)
    assert!(.egress.proto == "tcp")
    assert!(.egress.uid == 1000)
    assert!(.egress.scope == "container")
    assert!(.egress.count == 3)
    assert!(!exists(.tcp_rtt_ms))
    assert!(!exists(.tcp_rttvar_ms))
    assert!(!exists(.tcp_mss))
    assert!(!exists(.smtp_helo))
    assert!(!exists(.smtp_mail_from))
    assert!(!exists(.smtp_rcpt))
    assert!(!exists(.smtp_auth_user))
    assert!(!exists(.smtp_auth_pass))
    assert!(!exists(.smtp_starttls))
    assert!(!exists(.http_host_foreign))
    assert!(!exists(.bait_served))
    assert!(!exists(.bait_credential_used))
    assert!(!exists(.egress_dst_ip))
    assert!(!exists(.egress_dst_port))
    assert!(!exists(.egress_proto))
    assert!(!exists(.egress_uid))
    assert!(!exists(.egress_scope))
    assert!(!exists(.egress_count))
    '''

# S3: absent. None of the wave-1 fields are present, so none of their parent
# objects get created either.
[[tests]]
name = "s3_fields_absent"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:06:00+00:00","kind":"connect","port":22,"role":"ssh","ip":"203.0.113.8","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":10,"hold_ms":0,"spoke":false}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(.classification == "port-confirm")
    assert!(!exists(.network))
    assert!(!exists(.smtp))
    assert!(!exists(.bait))
    assert!(!exists(.egress))
    '''

# S4: one needle in a request line, and threat.tool from the user agent
# survives the exploit assignment that comes after it.
[[tests]]
name = "s4_single_needle_keeps_tool"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:07:00+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.9","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":30,"hold_ms":0,"spoke":true,"http_user_agent":"Mozilla/5.0 zgrab/0.x","http_host":"203.0.113.9","http_requests":["POST /SDK/webLanguage HTTP/1.1"]}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(array!(.threat.exploit) == ["hikvision-cve-2021-36260"])
    assert!(.threat.tool == "zgrab")
    '''

# S5: two needles in one event, one from the request line and one from the
# body, both land in threat.exploit in the order the table lists them.
[[tests]]
name = "s5_two_needles"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:08:00+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.10","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":30,"hold_ms":0,"spoke":true,"http_requests":["GET /HNAP1 HTTP/1.1"],"http_body":"${jndi:ldap://x}"}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(array!(.threat.exploit) == ["dlink-hnap", "log4shell-cve-2021-44228"])
    '''

# S6: an ordinary request line matches no needle, so threat.exploit is

# S7: proxy_probe. CONNECT and an absolute-URI GET both trip it; a path that
# merely contains "http://" after the leading slash, and a lowercase
# "connect", do not -- the method is case-sensitive, as HTTP is.
[[tests]]
name = "s7_connect_trips_proxy_probe"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:10:00+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.12","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":30,"hold_ms":0,"spoke":true,"http_requests":["CONNECT example.com:443 HTTP/1.1"]}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(.threat.proxy_probe == true)
    '''

[[tests]]
name = "s7_absolute_uri_trips_proxy_probe"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:10:01+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.13","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":30,"hold_ms":0,"spoke":true,"http_requests":["GET http://example.com/ HTTP/1.1"]}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(.threat.proxy_probe == true)
    '''

[[tests]]
name = "s7_embedded_scheme_does_not_trip"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:10:02+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.14","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":30,"hold_ms":0,"spoke":true,"http_requests":["GET /http://x HTTP/1.1"]}'''

  [[tests.outputs]]

# S8: hostile types on the fallible fields. Both transforms run with
# drop_on_error = true, so each of these proves the event survives rather
# than vanishing silently.
[[tests]]
name = "s8_http_requests_as_string"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:11:00+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.16","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":10,"hold_ms":0,"spoke":true,"http_requests":"GET / HTTP/1.1"}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(.event.dataset == "tripwire.sentinel")
    assert!(!exists(.threat.exploit))
    assert!(!exists(.threat.proxy_probe))
    '''

[[tests]]
name = "s8_http_requests_as_null"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:11:01+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.17","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":10,"hold_ms":0,"spoke":true,"http_requests":null}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(.event.dataset == "tripwire.sentinel")
    assert!(!exists(.threat.exploit))
    assert!(!exists(.threat.proxy_probe))
    '''

[[tests]]
name = "s8_http_requests_array_holding_a_number"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:11:02+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.18","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":10,"hold_ms":0,"spoke":true,"http_requests":[404, "GET /HNAP1 HTTP/1.1"]}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    # join() on a mixed-type array errors on the whole array, not just the
    # bad element (confirmed against the real 0.58.0 binary), so the `?? ""`
    # a few lines up blanks the entire haystack here -- the string element's
    # own needle does not get a free pass. The event still is not dropped.
    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert!(.event.dataset == "tripwire.sentinel")
    assert!(!exists(.threat.exploit))
    '''

[[tests]]
name = "s8_http_body_as_object"

  [[tests.inputs]]
  insert_at = "sentinel_events"
  type = "log"
  log_fields.message = '''{"ts":"2026-09-19T10:11:03+00:00","kind":"connect","port":80,"role":"http","ip":"203.0.113.19","distinct_ports":1,"first_contact":true,"sweeping":false,"held_ms":10,"hold_ms":0,"spoke":true,"http_body":{"nested":"object"}}'''

  [[tests.outputs]]
  extract_from = "sentinel_events"

    [[tests.outputs.conditions]]

# Vector 0.58.0 on the sentinel host.
#
# Ships to the collector over a private link. Both the endpoint and the
# password come from the secrets file rather than being written here, because
# they are site-specific. A public address would be a mistake: OpenSearch is
# bound to loopback on the collector and should be reached over WireGuard or
# Tailscale, not over the internet.
#
# The endpoint is not a secret. It travels through the same backend because
# Vector 0.57 disabled `${VAR}` interpolation in configuration files, so the
# secrets backend is now the only supported way to keep a per-host value out
# of a file that is committed. Getting this wrong is quiet rather than loud:
# an uninterpolated `${VAR}` is passed through verbatim, which for a password
# means every write is rejected with 401.
#
# The disk buffer matters more here than on the collector. The link between
# the two hosts is a network that can go away, and a sensor whose shipper
# drops events during an outage is blind exactly when something interesting
# is happening. With acknowledgements on and the buffer blocking when full,
# an outage costs latency: Vector fills the buffer, stops advancing its read
# checkpoint, and the lines wait in the file until the link is back.

data_dir = "/var/lib/vector"

[api]
enabled = false

[secret.local]
type = "file"
path = "/etc/vector/secrets.json"

[sources.sentinel]
type = "file"
# Package D's egress watcher writes its own JSONL under a different
# directory; folding it into this source keeps one shipper on this host. A
# path in `include` that does not exist yet is not an error for a file
# source, so this ships fine ahead of D landing on a given VM.
include = [
  "/var/log/sentinel/connections.jsonl",
  "/var/log/tripwire-egress/egress.jsonl",
]
read_from = "beginning"
fingerprint.strategy = "checksum"
fingerprint.lines = 1
max_line_bytes = 65536

[transforms.sentinel_events]
type = "remap"
inputs = ["sentinel"]
drop_on_error = true
reroute_dropped = true
source = '''
parsed = object!(parse_json!(.message))
del(.message)
. = merge(., parsed)

."@timestamp" = .ts
del(.ts)
.event = {
  "kind": "event",
  "dataset": "tripwire.sentinel",
  "module": "sentinel",
  "ingested": .timestamp
}
.log = { "file": { "path": .file } }
del(.timestamp)
del(.file)
del(.host)
del(.source_type)
.source = { "ip": .ip }
del(.ip)
# Same field names as the receiver's hits, so one dashboard panel covers
# both. Absent on connections that never spoke HTTP.
.http = { "user_agent": .http_user_agent, "host": .http_host }
del(.http_user_agent)
del(.http_host)

# An address is cheap identity: rented, rotated, shared. A protocol stack is
# expensive identity. HASSH is the client's SSH algorithm lists, JA4 the shape
# of its TLS ClientHello, and the HTTP hash the order of its headers; all
# three are properties of the tool rather than of where it is running, so they
# hold across a change of address and are what the campaign clustering groups
# on. Most connections carry none of them, and this transform drops the whole
# event on any error, so every move is guarded by exists(). del() returns the
# value it removes, which is what makes each line a move rather than a copy.
if exists(.ssh_hassh) { .fingerprint.hassh = del(.ssh_hassh) }
if exists(.tls_ja4) { .fingerprint.ja4 = del(.tls_ja4) }
if exists(.http_header_hash) { .fingerprint.http = del(.http_header_hash) }
if exists(.tls_sni) { .tls.sni = del(.tls_sni) }
if exists(.tls_alpn) { .tls.alpn = del(.tls_alpn) }
if exists(.tls_version) { .tls.version = del(.tls_version) }
if exists(.http_header_order) { .http.header_order = del(.http_header_order) }
# ssh_client stays where it is: the dashboards and the tool test below read
# it flat, and the banner is a claim rather than a measurement.
if exists(.ssh_kex_client) { .ssh.kex = del(.ssh_kex_client) }

# Wave 1 fields: A1's network/SMTP/HTTP additions, A2's STARTTLS and bait
# fields, D's egress summaries. Moved now so this file does not need
# reopening later; an absent field costs nothing. proto_mismatch stays flat
# (it is not nested anywhere), so there is no move line for it.
if exists(.tcp_rtt_ms) { .network.rtt_ms = del(.tcp_rtt_ms) }
if exists(.tcp_rttvar_ms) { .network.rttvar_ms = del(.tcp_rttvar_ms) }
if exists(.tcp_mss) { .network.mss = del(.tcp_mss) }
if exists(.smtp_helo) { .smtp.helo = del(.smtp_helo) }
if exists(.smtp_mail_from) { .smtp.mail_from = del(.smtp_mail_from) }
if exists(.smtp_rcpt) { .smtp.rcpt = del(.smtp_rcpt) }
if exists(.smtp_auth_user) { .smtp.auth_user = del(.smtp_auth_user) }
if exists(.smtp_auth_pass) { .smtp.auth_pass = del(.smtp_auth_pass) }
if exists(.smtp_starttls) { .smtp.starttls = del(.smtp_starttls) }
if exists(.http_host_foreign) { .http.host_foreign = del(.http_host_foreign) }
if exists(.bait_served) { .bait.served = del(.bait_served) }
if exists(.bait_credential_used) { .bait.credential_used = del(.bait_credential_used) }
if exists(.egress_dst_ip) { .egress.dst_ip = del(.egress_dst_ip) }
if exists(.egress_dst_port) { .egress.dst_port = del(.egress_dst_port) }
if exists(.egress_proto) { .egress.proto = del(.egress_proto) }
if exists(.egress_uid) { .egress.uid = del(.egress_uid) }
if exists(.egress_scope) { .egress.scope = del(.egress_scope) }
if exists(.egress_count) { .egress.count = del(.egress_count) }

# Which tool this looks like, from what the client volunteered. The SSH
# banner is the most honest signal: Go's ssh library announces itself as
# exactly "SSH-2.0-Go", and the "PUTTY" spelling is a brute-forcer imitating
# PuTTY, which writes "PuTTY_Release". The user-agent half is duplicated in
# vector.toml; keep them in step. enrich.py adds who owns the address later.
ssh = string(.ssh_client) ?? ""
ua = downcase(string(.http.user_agent) ?? "")
paths = downcase(join(array(.http_requests) ?? [], " ") ?? "")
tool = if ssh == "SSH-2.0-Go" { "go-ssh"
} else if contains(ssh, "PUTTY") { "fake-putty"
} else if contains(ssh, "PuTTY") { "putty"
} else if contains(ssh, "ZGrab") || contains(ua, "zgrab") { "zgrab"
} else if contains(ssh, "libssh") { "libssh"
} else if contains(ssh, "paramiko") { "paramiko"
} else if contains(ssh, "Nmap") || contains(ua, "nmap") { "nmap"
} else if contains(ssh, "OpenSSH") { "openssh"
} else if contains(ssh, "JSCH") { "jsch"
} else if contains(ssh, "AsyncSSH") { "asyncssh"
} else if contains(ssh, "Ruby/Net::SSH") { "ruby-net-ssh"
} else if contains(ssh, "sshlib") { "sshlib"
} else if ssh != "" { "ssh-other"
} else if contains(ua, "censysinspect") { "censys"
} else if contains(ua, "expanse") || contains(ua, "paloaltonetworks") { "xpanse"
} else if contains(ua, "internetmeasurement") { "driftnet"
} else if contains(ua, "security.ipip.net") { "ipip"
} else if contains(ua, "leakix") || contains(ua, "l9explore") { "leakix"
} else if contains(ua, "getodin") || starts_with(ua, "odin") { "odin"
} else if contains(ua, "modat") { "modat"
} else if contains(ua, "nuclei") { "nuclei"
} else if contains(ua, "masscan") { "masscan"
} else if contains(ua, "zmap") { "zmap"
} else if contains(ua, "go-http-client") { "go-http"
} else if contains(ua, "python") || contains(ua, "aiohttp") { "python"
} else if starts_with(ua, "curl/") { "curl"
} else if starts_with(ua, "wget/") { "wget"
} else if contains(ua, "libwww-perl") { "perl"
} else if contains(ua, "fasthttp") { "fasthttp"
} else if contains(ua, "hello world") || contains(ua, "hello, world") { "hello-world"
} else if contains(paths, "/boaform/") { "boa-router-exploit"
} else if contains(paths, "gponform") || contains(paths, "/hnap1") || contains(paths, "/cgi-bin/luci") || contains(paths, "setup.cgi") || contains(paths, "/shell") { "iot-exploit"
} else if contains(paths, "/.env") || contains(paths, "/.git") || contains(paths, "/.aws") || contains(paths, "phpinfo") { "secret-file-probe"
} else if contains(paths, "wp-") || contains(paths, "xmlrpc.php") { "wordpress-probe"
} else { null }
if tool != null { .threat = { "tool": tool } }

# Named exploit signatures in what the client actually sent. http_requests
# and http_body are attacker-controlled and may arrive as any JSON type; the
# array()/string() assertions plus ?? turn a wrong type into "absent" rather
# than a dropped event. `paths` above is already the lowercased join of
# http_requests, so it is reused rather than rebuilt. The table is
# duplicated in vector.toml; keep them in step. Placed after the line that
# sets .threat, since that line replaces the object rather than merging.
hay = paths + " " + downcase(string(.http_body) ?? "")
names = []
if contains(hay, "/sdk/weblanguage") { names = push(names, "hikvision-cve-2021-36260") }
if contains(hay, "/boaform/admin/formlogin") { names = push(names, "boa-formlogin") }
if contains(hay, "/cgi-bin/luci/;stok=/locale") { names = push(names, "tplink-cve-2023-1389") }
if contains(hay, "/gponform/diag_form") { names = push(names, "gpon-cve-2018-10561") }
if contains(hay, "/hnap1") { names = push(names, "dlink-hnap") }
if contains(hay, "setup.cgi?next_file=netgear.cfg") { names = push(names, "netgear-dgn-setup-cgi") }
if contains(hay, "eval-stdin.php") { names = push(names, "phpunit-cve-2017-9841") }
if contains(hay, "/actuator/gateway/routes") { names = push(names, "spring-gateway-cve-2022-22947") }
if contains(hay, "/cgi-bin/.%2e/") { names = push(names, "apache-cve-2021-41773") }
if contains(hay, "/_ignition/execute-solution") { names = push(names, "laravel-ignition-cve-2021-3129") }
if contains(hay, "${jndi:") { names = push(names, "log4shell-cve-2021-44228") }
if contains(hay, "/autodiscover/autodiscover.json") { names = push(names, "exchange-proxyshell") }
if contains(hay, "/mgmt/tm/util/bash") { names = push(names, "f5-cve-2022-1388") }
if contains(hay, "/ws/v1/cluster/apps/new-application") { names = push(names, "hadoop-yarn-rce") }
if contains(hay, "/device.rsp?opt=sys&cmd=") { names = push(names, "tbk-dvr-cve-2024-3721") }
if contains(hay, "/shell?cd+/tmp") { names = push(names, "jaws-webserver-rce") }
if length(names) > 0 { .threat.exploit = names }

# CONNECT and absolute-URI request lines are a proxy abuse probe. The method
# is case-sensitive, as HTTP is, so this walks the raw request lines rather
# than the lowercased haystack above. The receiver sits behind a CDN that
# never forwards a request shaped like this, so vector.toml does not get
# this field.
proxy = false
for_each(array(.http_requests) ?? []) -> |_i, v| {
  line = string(v) ?? ""
  if starts_with(line, "CONNECT ") || match(line, r'^[A-Z]+ https?://') {
    proxy = true
  }
}
if proxy { .threat.proxy_probe = true }

# A connection that completed the handshake and then said nothing is a
# scanner confirming the port is open. One that spoke the protocol is trying
# to use the service. One that spoke while we had already decided it was
# sweeping is doing both.
#
# Not every line is a connection. The sentinel also emits a one-off summary
# when an address first crosses the sweep threshold, and a marker when it
# sheds a connection at capacity, and package D's egress watcher emits a
# summary with kind "egress" and no port at all. All three have to be taken
# out before the spoke/sweeping test, or they get filed as a scanner
# confirming a port that is not in the record.
kind = string(.kind) ?? "connect"
outcome = string(.outcome) ?? ""
spoke = bool(.spoke) ?? false
sweeping = bool(.sweeping) ?? false
.classification = if kind == "egress" {
  "egress-blocked"
} else if kind == "sweep" {
  "sweep-detected"
} else if outcome == "shed-load" {
  "shed-load"
} else if !spoke {
  "port-confirm"
} else if sweeping {
  "sweep-interaction"
} else {
  "service-interaction"
}
'''

[sinks.opensearch_sentinel]
type = "elasticsearch"
inputs = ["sentinel_events"]
endpoints = ["SECRET[local.opensearch_endpoint]"]
api_version = "v7"
mode = "bulk"
# The write alias, not a dated name. bootstrap-opensearch.sh creates it and
# ISM rolls it daily; the sentinel-writer role cannot create indices itself.
bulk.index = "tripwire-sentinel"
auth.strategy = "basic"
auth.user = "sentinel-writer"
auth.password = "SECRET[local.opensearch_password]"
# The cluster uses self-signed demo certificates and is reached over a
# private encrypted link, which is what is actually protecting this traffic.
# Issue real certificates and turn these back on if that stops being true.
tls.verify_certificate = false
tls.verify_hostname = false
acknowledgements.enabled = true
batch.timeout_secs = 10

[sinks.opensearch_sentinel.buffer]
type = "disk"
# Larger than the collector's, because this one has a network between it and
# the destination. At roughly 400 bytes an event this holds several million
# connections, which is more outage than a sensor is likely to survive.
max_size = 1073741824
when_full = "block"

[sinks.parse_failures]
type = "console"
inputs = ["sentinel_events.dropped"]
target = "stderr"
encoding.codec = "json"

# Vector 0.58.0. Tails the receiver's JSON lines and ships them to OpenSearch.
#
# Two deliberate choices worth knowing about.
#
# First, the shipper reads a file, not the SQLite database. SQLite in WAL mode
# tolerates a concurrent reader, but a shipper that opens the database can
# still stall a write under load, and the receiver's whole job is to never
# drop a hit. A file tail cannot interfere with the writer at all.
#
# This ships the receiver's hits only. The port-scan sentinel runs on a
# different host and has its own shipper, vector-sentinel.toml, which
# writes into the same indices across a private link.
#
# Second, request headers are shipped as an encoded string rather than as an
# object. Header names are attacker-controlled. Letting OpenSearch map each
# one dynamically means anyone who can reach the honeypot can create
# unlimited fields in the index mapping, which is a cheap way to break the
# cluster. The handful of headers actually worth querying are lifted into
# fixed fields; the rest travel as opaque text.

data_dir = "/var/lib/vector"

[api]
enabled = false

# --------------------------------------------------------------------------
# Secrets
# --------------------------------------------------------------------------
#
# Vector 0.57 turned off `${VAR}` interpolation in configuration files by
# default, and 0.58 keeps it off. A config that still uses that syntax does
# not fail: Vector sends the literal string `${OPENSEARCH_PASSWORD}` as the
# password and every write comes back 401. The flag that restores the old
# behaviour is named --dangerously-allow-env-var-interpolation for a reason,
# because an environment variable that reaches a field like a file source's
# `include` turns into an arbitrary file read.
#
# The secrets backend is the supported replacement. This one reads a flat
# JSON object of string to string; ./setup-logging.sh writes it with mode
# 600 and never prints the contents.

[secret.local]
type = "file"
path = "/etc/vector/secrets.json"

# --------------------------------------------------------------------------
# Sources
# --------------------------------------------------------------------------

[sources.tripwire]
type = "file"
include = ["/var/log/tripwire/hits.jsonl"]
read_from = "beginning"
# Follow the inode rather than the name, so a rotation finishes the old file
# before moving on and nothing is lost in the gap.
fingerprint.strategy = "checksum"
fingerprint.lines = 1
max_line_bytes = 262144

# --------------------------------------------------------------------------
# Transforms
# --------------------------------------------------------------------------

[transforms.hits]
type = "remap"
inputs = ["tripwire"]
drop_on_error = true
reroute_dropped = true
source = '''
parsed = object!(parse_json!(.message))
del(.message)
. = merge(., parsed)

."@timestamp" = .ts
del(.ts)

# Vector's own metadata. The ingest time is worth keeping, because the gap
# between it and @timestamp is how you notice the shipper falling behind.
# The container id in .host is not.
.event = {
  "kind": "event",
  "dataset": "tripwire.hits",
  "module": "receiver",
  "ingested": .timestamp
}
.log = { "file": { "path": .file } }
del(.timestamp)
del(.file)
del(.host)
del(.source_type)

# What each tier actually proved. Kept in step with the docstring in
# receiver.py; if you add a tier there, add it here.
tiers = {
  "0": "render-or-cover",
  "1": "url-extractor",
  "2": "instruction-follower",
  "3": "collection-post",
  "4": "probe",
  "5": "tarpit"
}
tier_key = to_string(.tier) ?? "?"
.tier_name = get(tiers, [tier_key]) ?? "unknown"

# Header names are attacker-controlled. Lift the few worth querying into
# fixed fields and encode the rest, so nothing can grow the index mapping.
headers = object(.headers) ?? {}
lower = {}
for_each(headers) -> |k, v| {
  lower = set!(lower, [downcase(k)], v)
}
.http = {
  "user_agent": .user_agent,
  "referer":         get(lower, ["referer"]) ?? null,
  "accept":          get(lower, ["accept"]) ?? null,
  "accept_language": get(lower, ["accept-language"]) ?? null,
  "accept_encoding": get(lower, ["accept-encoding"]) ?? null,
  "sec_fetch_mode":  get(lower, ["sec-fetch-mode"]) ?? null,
  "sec_fetch_dest":  get(lower, ["sec-fetch-dest"]) ?? null,
  "cf_connecting_ip": get(lower, ["cf-connecting-ip"]) ?? null,
  # Set by Cloudflare on the way in: the edge's own country verdict and the
  # request id you can paste into the Cloudflare dashboard.
  "cf_ipcountry":     get(lower, ["cf-ipcountry"]) ?? null,
  "cf_ray":           get(lower, ["cf-ray"]) ?? null,
  "x_forwarded_for":  get(lower, ["x-forwarded-for"]) ?? null,
  "header_count": length(headers),
  "headers_raw": encode_json(headers)
}
del(.headers)
del(.user_agent)

# A hit that carried no render beacon and no fetch metadata read the page as
# text. Precomputing it here means the dashboard does not have to.
.no_fetch_metadata = .http.sec_fetch_mode == null

.source = { "ip": .ip }
del(.ip)

# Which tool this looks like, from what the client volunteered. Local and
# cheap; enrich.py adds who owns the address afterwards. An honest name in
# the user agent beats a guess from the path, so the agent checks come first.
# The user-agent half is duplicated in vector-sentinel.toml; keep them in step.
ua = downcase(string(.http.user_agent) ?? "")
path = downcase(string(.path) ?? "")
tool = if contains(ua, "zgrab") { "zgrab"
} else if contains(ua, "censysinspect") { "censys"
} else if contains(ua, "expanse") || contains(ua, "paloaltonetworks") { "xpanse"
} else if contains(ua, "internetmeasurement") { "driftnet"
} else if contains(ua, "security.ipip.net") { "ipip"
} else if contains(ua, "leakix") || contains(ua, "l9explore") { "leakix"
} else if contains(ua, "getodin") || starts_with(ua, "odin") { "odin"
} else if contains(ua, "modat") { "modat"
} else if contains(ua, "nuclei") { "nuclei"
} else if contains(ua, "masscan") { "masscan"
} else if contains(ua, "nmap") { "nmap"
} else if contains(ua, "zmap") { "zmap"
} else if contains(ua, "go-http-client") { "go-http"
} else if contains(ua, "python") || contains(ua, "aiohttp") { "python"
} else if starts_with(ua, "curl/") { "curl"
} else if starts_with(ua, "wget/") { "wget"
} else if contains(ua, "libwww-perl") { "perl"
} else if contains(ua, "fasthttp") { "fasthttp"
} else if contains(ua, "hello world") || contains(ua, "hello, world") { "hello-world"
} else if contains(path, "/boaform/") { "boa-router-exploit"
} else if contains(path, "gponform") || contains(path, "/hnap1") || contains(path, "/cgi-bin/luci") || contains(path, "setup.cgi") || contains(path, "/shell") { "iot-exploit"
} else if contains(path, "/.env") || contains(path, "/.git") || contains(path, "/.aws") || contains(path, "phpinfo") { "secret-file-probe"
} else if contains(path, "wp-") || contains(path, "xmlrpc.php") { "wordpress-probe"
} else { null }
if tool != null { .threat = { "tool": tool } }

# Named exploit signatures in the path and posted body. `path` above is
# already the lowercased request path, so it is reused rather than rebuilt.
# body_excerpt is attacker-controlled and may arrive as any JSON type; the
# string() assertion plus ?? turns a wrong type into "absent" rather than a
# dropped event. The table is duplicated in vector-sentinel.toml; keep them
# in step. Placed after the line that sets .threat, since that line replaces
# the object rather than merging. The receiver sits behind a CDN that never
# forwards a CONNECT or absolute-URI request, so this file has no
# threat.proxy_probe.
hay = path + " " + downcase(string(.body_excerpt) ?? "")
names = []
if contains(hay, "/sdk/weblanguage") { names = push(names, "hikvision-cve-2021-36260") }
if contains(hay, "/boaform/admin/formlogin") { names = push(names, "boa-formlogin") }
if contains(hay, "/cgi-bin/luci/;stok=/locale") { names = push(names, "tplink-cve-2023-1389") }
if contains(hay, "/gponform/diag_form") { names = push(names, "gpon-cve-2018-10561") }
if contains(hay, "/hnap1") { names = push(names, "dlink-hnap") }
if contains(hay, "setup.cgi?next_file=netgear.cfg") { names = push(names, "netgear-dgn-setup-cgi") }
if contains(hay, "eval-stdin.php") { names = push(names, "phpunit-cve-2017-9841") }
if contains(hay, "/actuator/gateway/routes") { names = push(names, "spring-gateway-cve-2022-22947") }
if contains(hay, "/cgi-bin/.%2e/") { names = push(names, "apache-cve-2021-41773") }
if contains(hay, "/_ignition/execute-solution") { names = push(names, "laravel-ignition-cve-2021-3129") }
if contains(hay, "${jndi:") { names = push(names, "log4shell-cve-2021-44228") }
if contains(hay, "/autodiscover/autodiscover.json") { names = push(names, "exchange-proxyshell") }
if contains(hay, "/mgmt/tm/util/bash") { names = push(names, "f5-cve-2022-1388") }
if contains(hay, "/ws/v1/cluster/apps/new-application") { names = push(names, "hadoop-yarn-rce") }
if contains(hay, "/device.rsp?opt=sys&cmd=") { names = push(names, "tbk-dvr-cve-2024-3721") }
if contains(hay, "/shell?cd+/tmp") { names = push(names, "jaws-webserver-rce") }
if length(names) > 0 { .threat.exploit = names }
'''

# --------------------------------------------------------------------------
# Sinks
# --------------------------------------------------------------------------
#
# acknowledgements.enabled means the file sources do not advance their read
# checkpoint until OpenSearch has confirmed the write. Combined with the disk
# buffer and when_full = "block", a cluster restart costs latency rather than
# events: Vector fills its buffer, then stops reading, and the lines stay in
# the file until it can catch up.

[sinks.opensearch_hits]
type = "elasticsearch"
inputs = ["hits"]
endpoints = ["https://opensearch:9200"]
api_version = "v7"
mode = "bulk"
bulk.index = "tripwire-hits-%Y.%m.%d"
auth.strategy = "basic"
auth.user = "admin"
auth.password = "SECRET[local.opensearch_password]"
# The cluster ships with self-signed demo certificates and is only reachable
# on the internal container network. Verification is off because there is no
# certificate authority to verify against, not because the traffic is
# uninteresting. Issue real certificates if this ever crosses a host boundary.
tls.verify_certificate = false
tls.verify_hostname = false
acknowledgements.enabled = true
batch.timeout_secs = 5

[sinks.opensearch_hits.buffer]
type = "disk"
max_size = 268435488
when_full = "block"

# Anything that failed to parse. This is where a malformed line ends up, and
# seeing it in `podman logs tripwire-vector` is the fastest way to notice the
# receiver and the parse rules have drifted apart.
[sinks.parse_failures]
type = "console"
inputs = ["hits.dropped"]
target = "stderr"
encoding.codec = "json"
